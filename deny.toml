# cargo-deny policy, run by `scripts/verify.sh --full`.
# Griffin ships as MIT OR Apache-2.0, so every dependency must be compatible with both.

[graph]
all-features = true

[advisories]
# Vulnerable, unmaintained, unsound and yanked crates fail the check.
yanked = "deny"

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  # Public domain dedication, used by notify (cargo-griffin dev).
  "CC0-1.0",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
