[package]
name = "navigation"
description = "Griffin example: patching the URL, live navigation between live sessions, a redirect with flash and the page title."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# Not aliased to `griffin`, as in the counter example.
griffin-web = { path = "../../crates/griffin-web" }
# For the query string of a page: a typed struct.
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread"] }
