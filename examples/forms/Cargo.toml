[package]
name = "forms"
description = "Griffin example: one Changeset behind a live form and a controller form, with input Components fed by a Form."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
griffin-domain = { path = "../../griffin-domain" }
# Not aliased to `griffin`, as in the counter example.
griffin-web = { path = "../../griffin-web" }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "sync"] }
