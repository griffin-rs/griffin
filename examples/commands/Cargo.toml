[package]
name = "commands"
description = "Griffin example: client commands, client hooks, pushed events, replies and the client's own bindings."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# Not aliased to `griffin`, as in the counter example.
griffin-web = { path = "../../griffin-web" }
# For `json!`: a reply and a pushed event's payload are JSON values.
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread"] }
